version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jasur1803
    ports:
      - "8080:8080"
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: BalanceTransactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jasur1803
    ports:
      - "5432:5432"